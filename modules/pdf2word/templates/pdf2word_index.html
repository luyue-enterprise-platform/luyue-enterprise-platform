<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量PDF转WORD系统</title>
    <link rel="stylesheet" href="{{ url_for('pdf2word.static', filename='css/style.css') }}">
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">📄</span>
            <span class="brand-text">批量PDF转WORD系统 <span style="font-size:11px;color:#999;">v2.0.0 可逆转换</span></span>
        </div>
        <div class="nav-actions">
            <a class="btn-nav" href="/" title="返回首页">🏠 返回首页</a>
            <button class="btn-nav" onclick="location.reload()" title="刷新页面">🔄 刷新</button>
        </div>
    </nav>

    <main class="main-content">
        <!-- 第一步：选择转换方向 -->
        <section class="card">
            <div class="card-header">
                <span class="step-badge">1</span>
                <h2>选择转换方向</h2>
            </div>
            <div class="card-body">
                <div class="direction-group" id="directionGroup">
                    <label class="direction-option">
                        <input type="radio" name="direction" value="pdf2word" checked
                               onchange="onDirectionChange('pdf2word')">
                        <span class="direction-label">📄 PDF 转 Word</span>
                        <span class="direction-desc">原有功能：批量将 PDF 转换为 Word (.docx)</span>
                    </label>
                    <label class="direction-option">
                        <input type="radio" name="direction" value="topdf"
                               onchange="onDirectionChange('topdf')">
                        <span class="direction-label">📑 其他格式转 PDF</span>
                        <span class="direction-desc">可逆转换：图片 / Word / Excel / TXT / PDF 批量转为 PDF，支持文件夹递归</span>
                    </label>
                </div>
                <!-- 输出模式（仅"转PDF"方向可见） -->
                <div class="mode-group" id="modeGroup" style="display:none;">
                    <div class="mode-title">输出模式：</div>
                    <label class="mode-option">
                        <input type="radio" name="output_mode" value="merge" checked>
                        <span>合并模式 — 按上传顺序合并为单个 PDF</span>
                    </label>
                    <label class="mode-option">
                        <input type="radio" name="output_mode" value="individual">
                        <span>独立模式 — 每个文件独立 PDF，一一对应可溯源</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 第二步：上传文件 -->
        <section class="card">
            <div class="card-header">
                <span class="step-badge">2</span>
                <h2 id="uploadTitle">上传 PDF 文件</h2>
                <span class="card-tip" id="uploadTip">仅支持 .pdf 格式，可批量上传</span>
            </div>
            <div class="card-body">
                <div class="dropzone" id="dropzone">
                    <input type="file" id="fileInput" accept=".pdf" multiple hidden>
                    <div class="dropzone-content">
                        <span class="upload-icon">📄</span>
                        <p id="dropzoneMainText">拖拽 PDF 文件到此处</p>
                        <p class="upload-hint">或 <a href="#" onclick="document.getElementById('fileInput').click();return false;">点击选择文件</a></p>
                        <p class="upload-hint" id="dropzoneSubText">支持批量上传多个 PDF 文件</p>
                        <p class="upload-hint" id="pickFolderEntry" style="display:none;">
                            也可以 <a href="#" onclick="pickFolder();return false;">📂 选择整个文件夹</a>（递归解析其中所有可转换文件）
                        </p>
                    </div>
                </div>
                <div class="file-list" id="fileList" style="display:none;">
                    <div class="file-list-header">
                        <span id="fileCount"></span>
                        <button class="btn-ghost btn-sm" onclick="clearFiles()">清空</button>
                    </div>
                    <div class="file-items" id="fileItems"></div>
                </div>
            </div>
        </section>

        <!-- 开始转换 -->
        <section class="card" id="actionSection" style="display:none;">
            <div class="card-body" style="text-align:center;">
                <button class="btn-primary btn-lg" id="startBtn" onclick="startConvert()">
                    🚀 开始转换
                </button>
                <p class="action-hint" id="actionHint">将选中的 PDF 文件批量转换为 Word (.docx) 格式</p>
            </div>
        </section>

        <!-- 转换进度 -->
        <section class="card" id="progressSection" style="display:none;">
            <div class="card-header">
                <h2>转换进度</h2>
            </div>
            <div class="card-body">
                <div class="progress-bar-wrapper">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p class="progress-text" id="progressText">准备中...</p>
            </div>
        </section>

        <!-- 转换结果 -->
        <section class="card" id="resultSection" style="display:none;">
            <div class="card-header">
                <span class="step-badge done">✓</span>
                <h2>转换完成</h2>
            </div>
            <div class="card-body">
                <!-- 统计卡片 -->
                <div class="stats-grid" id="statsGrid"></div>

                <!-- 转换详情 -->
                <div class="result-detail">
                    <h3>转换详情</h3>
                    <div class="table-wrapper">
                        <table class="result-table" id="resultTable">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th id="thSrc">原PDF文件名</th>
                                    <th id="thDst">Word文件名</th>
                                    <th>页数</th>
                                    <th>状态</th>
                                    <th>失败原因</th>
                                </tr>
                            </thead>
                            <tbody id="resultTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 下载按钮 -->
                <div class="action-buttons">
                    <button class="btn-primary btn-lg" id="btnSaveToLocation" onclick="saveToLocation(this)">
                        📁 选择保存位置
                    </button>
                    <button class="btn-ghost" onclick="downloadAll(this)">
                        📥 下载ZIP
                    </button>
                    <button class="btn-ghost" onclick="resetAll()">
                        🔄 重新转换
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="{{ url_for('pdf2word.static', filename='js/app.js') }}"></script>
</body>
</html>
