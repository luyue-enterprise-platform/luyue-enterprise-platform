<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇总智能系统</title>
    <link rel="stylesheet" href="{{ url_for('pdfmerge.static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/portal" class="nav-back">← 返回主页</a>
        <span class="nav-title">汇总智能系统</span>
        <span class="nav-version">v2.0</span>
    </nav>

    <div class="container">
        <!-- Step 1: 模式选择 -->
        <div class="card">
            <div class="card-header">
                <span class="step-badge">1</span>
                <span class="card-title">选择模板模式</span>
            </div>
            <div class="card-body">
                <div class="mode-selector">
                    <div class="mode-card active" id="modeRefund" onclick="selectMode('refund')">
                        <div class="mode-icon">📤</div>
                        <div class="mode-name">退税模式</div>
                        <div class="mode-desc">退税申请 → 总台账 → 认定证明 → 增值税申报表 → 完税证明 → 劳动合同 → 四险参保证明</div>
                    </div>
                    <div class="mode-card" id="modeDeduction" onclick="selectMode('deduction')">
                        <div class="mode-icon">📊</div>
                        <div class="mode-name">抵税模式</div>
                        <div class="mode-desc">情况说明 → 减免税明细申报表 → 台账 → 认定证明 → 就业信息表 → 劳动合同 → 四险参保证明</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 2: 封面信息 -->
        <div class="card">
            <div class="card-header">
                <span class="step-badge">2</span>
                <span class="card-title">填写封面信息</span>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-row">
                        <label>封面标题</label>
                        <input type="text" id="coverTitle" placeholder="如：重点群体税收优惠政策">
                    </div>
                    <div class="form-row">
                        <label>公司名称</label>
                        <input type="text" id="companyName" placeholder="如：陕西鲁岳企业服务有限公司">
                    </div>
                    <div class="form-row">
                        <label>证明时间段</label>
                        <input type="text" id="periodText" placeholder="如：2023年1月-2023年12月">
                    </div>
                </div>
            </div>
        </div>

        <!-- Step 3: 文件选择 -->
        <div class="card">
            <div class="card-header">
                <span class="step-badge">3</span>
                <span class="card-title">选择资料文件</span>
            </div>
            <div class="card-body">
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="selectFolder()">📁 添加文件夹</button>
                    <button class="btn btn-primary" onclick="selectFiles()">📄 添加文件</button>
                    <button class="btn btn-danger" onclick="clearFiles()">🗑 全部清除</button>
                </div>
                <div class="capability-info" id="capabilityInfo"></div>
                <div id="fileList" class="file-list"></div>
                <div id="fileStats" class="file-stats"></div>
            </div>
        </div>

        <!-- Step 4: 转换与匹配 -->
        <div class="card">
            <div class="card-header">
                <span class="step-badge">4</span>
                <span class="card-title">智能转换与匹配</span>
            </div>
            <div class="card-body">
                <p class="step-desc">将所有文件转为图片 → OCR识别内容 → 与章节名目智能匹配</p>
                <button class="btn btn-primary btn-large" id="btnProcess" onclick="startProcess()">
                    🚀 开始转换和智能匹配
                </button>
                <div id="processProgress" class="progress-area" style="display:none;">
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="processBar" style="width:0%"></div>
                    </div>
                    <div class="progress-text" id="processText">准备中...</div>
                </div>
            </div>
        </div>

        <!-- Step 5: 匹配结果 -->
        <div class="card" id="cardMatch" style="display:none;">
            <div class="card-header">
                <span class="step-badge">5</span>
                <span class="card-title">匹配结果（可拖拽调整）</span>
                <div class="header-actions">
                    <button class="btn btn-sm btn-primary" onclick="addMoreFiles()">➕ 补充材料</button>
                    <button class="btn btn-sm" onclick="reMatch()">🔄 重新匹配</button>
                </div>
            </div>
            <div class="card-body">
                <div class="match-summary" id="matchSummary"></div>
                <div id="sectionsList" class="sections-list"></div>
                <div id="unmatchedSection" class="unmatched-section" style="display:none;">
                    <div class="unmatched-header">未匹配图片（不纳入PDF）</div>
                    <div id="unmatchedList" class="unmatched-list"></div>
                </div>
            </div>
        </div>

        <!-- Step 6: 生成PDF -->
        <div class="card" id="cardGenerate" style="display:none;">
            <div class="card-header">
                <span class="step-badge">6</span>
                <span class="card-title">生成汇总PDF</span>
            </div>
            <div class="card-body">
                <button class="btn btn-success btn-large" onclick="startGenerate()">
                    📑 生成PDF（含封面、目录、页码）
                </button>
                <div id="generateProgress" class="progress-area" style="display:none;">
                    <div class="progress-bar-container">
                        <div class="progress-bar success" id="generateBar" style="width:0%"></div>
                    </div>
                    <div class="progress-text" id="generateText">准备中...</div>
                </div>
                <div id="resultActions" class="result-actions" style="display:none;">
                    <button class="btn btn-primary" onclick="previewPDF()">👁 预览PDF</button>
                    <button class="btn btn-success" onclick="downloadPDF()">⬇ 下载</button>
                    <button class="btn btn-primary" onclick="saveTo()">💾 另存为</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('pdfmerge.static', filename='js/app.js') }}"></script>
</body>
</html>
