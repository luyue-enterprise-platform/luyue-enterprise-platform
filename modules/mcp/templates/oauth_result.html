<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权结果 - 鲁岳企业服务综合智能平台</title>
    <link rel="stylesheet" href="{{ url_for('mcp.static', filename='css/style.css') }}">
    <style>
        body { background: linear-gradient(160deg, #f4f7fb 0%, #e9eff7 100%); }
        .result-wrap { max-width: 560px; margin: 64px auto; padding: 0 16px; }
        .result-card {
            background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(15,42,80,.12);
            padding: 32px 26px; text-align: center;
        }
        .result-icon { font-size: 44px; margin-bottom: 10px; }
        .result-title { font-size: 18px; font-weight: 600; color: #1c2b3a; margin-bottom: 8px; }
        .result-desc { font-size: 13px; color: #6b7c90; line-height: 1.7; }
        .code-box {
            background: #f2f6fc; border: 1px dashed #b9cbe4; border-radius: 10px;
            padding: 14px; margin: 16px 0; font-family: Consolas, monospace;
            font-size: 15px; word-break: break-all; text-align: left; color: #24374d;
        }
        .btn {
            border: none; border-radius: 10px; padding: 11px 28px; font-size: 14px;
            cursor: pointer; margin-top: 6px;
        }
        .btn-copy { background: #2f6fed; color: #fff; font-weight: 600; }
        .btn-back { background: #eef1f6; color: #41526a; }
    </style>
</head>
<body>
    <div class="result-wrap">
        <div class="result-card">
            {% if kind == 'code' %}
                <div class="result-icon">✅</div>
                <div class="result-title">授权成功</div>
                <div class="result-desc">
                    请在 {{ ttl_minutes }} 分钟内将下方授权码复制到应用中完成连接。<br>
                    授权码一次性有效，请勿泄露给他人。
                </div>
                <div class="code-box" id="authCode">{{ code }}</div>
                <button class="btn btn-copy" onclick="copyCode()">一键复制授权码</button>
                <button class="btn btn-back" onclick="window.close()">关闭</button>
            {% elif kind == 'denied' %}
                <div class="result-icon">🚫</div>
                <div class="result-title">您已拒绝授权</div>
                <div class="result-desc">
                    未建立任何连接，平台未向该应用发放任何凭证。<br>
                    如需重新考虑，可再次从应用发起授权。
                </div>
            {% else %}
                <div class="result-icon">⚠️</div>
                <div class="result-title">授权请求无效</div>
                <div class="result-desc">{{ message or '请求参数不合法，未展示授权页。' }}</div>
            {% endif %}
        </div>
    </div>
    <script>
        function copyCode() {
            var text = document.getElementById('authCode').innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function () { alert('已复制'); });
            } else {
                var ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta);
                ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                alert('已复制');
            }
        }
    </script>
</body>
</html>
