<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 鲁岳企业服务·综合智能平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">LY</div>
                <h1>鲁岳企业服务</h1>
                <p>重点群体涉税申报项目资料处理综合智能平台</p>
            </div>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login" class="auth-form" id="loginForm">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" name="username" id="username" placeholder="请输入账号" required autofocus>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" id="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group remember-group">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberPwd">
                        <span>记住密码</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登 录</button>
            </form>

            <div class="auth-footer">
                <a href="/register">没有账号？前往注册</a>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var userEl = document.getElementById('username');
        var pwdEl = document.getElementById('password');
        var chkEl = document.getElementById('rememberPwd');
        var formEl = document.getElementById('loginForm');

        // 页面加载时读取已保存的账号密码
        try {
            var saved = localStorage.getItem('ly_remembered_login');
            if (saved) {
                var data = JSON.parse(saved);
                if (data.username) userEl.value = data.username;
                if (data.password) pwdEl.value = data.password;
                chkEl.checked = true;
            }
        } catch(e) {}

        // 表单提交时：如果勾选则保存，否则清除
        formEl.addEventListener('submit', function() {
            if (chkEl.checked) {
                var data = {
                    username: userEl.value,
                    password: pwdEl.value
                };
                try {
                    localStorage.setItem('ly_remembered_login', JSON.stringify(data));
                } catch(e) {}
            } else {
                try {
                    localStorage.removeItem('ly_remembered_login');
                } catch(e) {}
            }
        });
    })();
    </script>
</body>
</html>
