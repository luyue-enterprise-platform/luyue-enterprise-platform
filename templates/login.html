<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 鲁岳企业服务·综合智能平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">LY</div>
                <h1>鲁岳企业服务</h1>
                <p>重点群体涉税申报项目资料处理综合智能平台</p>
            </div>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login" class="auth-form" id="loginForm">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" name="username" id="username" placeholder="请输入账号" required autofocus>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" id="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group remember-group">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberPwd">
                        <span>记住密码</span>
                    </label>
                </div>
                <div id="loginError" class="auth-error" style="display:none;"></div>

                <!-- 登录页升级提示：认证服务异常/版本过旧导致无法登录时，仍可在此下载新版修复 -->
                <div id="updateBanner" style="display:none;margin-bottom:14px;padding:10px 12px;border-radius:8px;background:#fff7e0;border:1px solid #f0c36d;align-items:center;justify-content:space-between;gap:10px;">
                    <span style="font-size:13px;color:#7a5b00;line-height:1.5;">发现新版本 v<span id="updRemoteVer" style="font-weight:700;"></span><br><span style="font-size:12px;color:#a07c1a;">升级后即可正常登录</span></span>
                    <a id="updDownloadBtn" class="btn btn-primary" href="#" target="_blank" style="flex-shrink:0;padding:7px 14px;font-size:13px;text-decoration:none;">立即下载升级</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
            </form>

            <div class="auth-footer">
                <a href="/register">没有账号？前往注册</a>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var userEl = document.getElementById('username');
        var pwdEl = document.getElementById('password');
        var chkEl = document.getElementById('rememberPwd');
        var formEl = document.getElementById('loginForm');
        var errEl = document.getElementById('loginError');
        var btnEl = document.getElementById('loginBtn');

        function fillForm(username, password) {
            if (username) userEl.value = username;
            if (password) pwdEl.value = password;
            chkEl.checked = true;
        }

        function showMsg(msg) {
            errEl.textContent = msg;
            errEl.style.display = msg ? 'block' : 'none';
        }

        // 保存凭据到后端文件（同步文件 I/O，不依赖 WebView2 localStorage flush）
        function saveToBackend(creds) {
            return fetch('/api/remember_login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(creds),
                keepalive: true
            }).catch(function(){});
        }

        // 清除后端文件
        function clearBackend() {
            return fetch('/api/remember_login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: '', password: ''}),
                keepalive: true
            }).catch(function(){});
        }

        // 页面加载：先读 localStorage，没有则读后端文件
        function loadSaved() {
            // 1. 尝试 localStorage
            try {
                var saved = localStorage.getItem('ly_remembered_login');
                if (saved) {
                    var data = JSON.parse(saved);
                    if (data.username) {
                        fillForm(data.username, data.password);
                        return;
                    }
                }
            } catch(e) {}

            // 2. 回退：从后端文件读取
            fetch('/api/remember_login').then(function(resp) {
                return resp.json();
            }).then(function(data) {
                if (data.ok && data.username) {
                    fillForm(data.username, data.password);
                    // 同步到 localStorage（下次可直接读 localStorage）
                    try {
                        localStorage.setItem('ly_remembered_login', JSON.stringify({
                            username: data.username, password: data.password
                        }));
                    } catch(e) {}
                }
            }).catch(function(){});
        }

        loadSaved();

        // 登录页自动检测新版本（免登录接口）：发现新版则显示升级横幅，
        // 覆盖"认证服务器异常导致无法登录"的救火场景
        function checkLoginUpdate() {
            fetch('/api/app/check_update').then(function(resp) {
                return resp.json();
            }).then(function(data) {
                if (data && data.has_update && data.download_url) {
                    document.getElementById('updRemoteVer').textContent = data.remote_version || '';
                    document.getElementById('updDownloadBtn').setAttribute('href', data.download_url);
                    document.getElementById('updateBanner').style.display = 'flex';
                }
            }).catch(function(){});
        }
        checkLoginUpdate();

        // 表单提交：AJAX 登录 + 保存凭据
        var submitting = false;
        formEl.addEventListener('submit', function(e) {
            if (submitting) return; // 回退模式：允许原生表单提交
            e.preventDefault();
            showMsg('');
            btnEl.disabled = true;
            btnEl.textContent = '登录中...';

            var creds = {username: userEl.value, password: pwdEl.value};

            // 1. 保存/清除记住密码（localStorage + 后端文件）
            var savePromise;
            if (chkEl.checked) {
                try {
                    localStorage.setItem('ly_remembered_login', JSON.stringify(creds));
                } catch(e) {}
                savePromise = saveToBackend(creds);
            } else {
                try {
                    localStorage.removeItem('ly_remembered_login');
                } catch(e) {}
                savePromise = clearBackend();
            }

            // 2. 等待保存完成后再发送登录请求（确保凭据已持久化）
            savePromise.finally(function() {
                fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(creds)
                }).then(function(resp) {
                    return resp.json().then(function(data) {
                        if (data.ok) {
                            window.location.href = '/';
                        } else {
                            showMsg(data.error || '登录失败');
                            btnEl.disabled = false;
                            btnEl.textContent = '登 录';
                        }
                    });
                }).catch(function() {
                    // AJAX 失败时回退到原生表单提交
                    submitting = true;
                    formEl.submit();
                });
            });
        });
    })();
    </script>
</body>
</html>
