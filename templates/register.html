<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 鲁岳企业服务·综合智能平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img class="auth-logo" src="/static/assets/logo.png" alt="鲁岳企业服务">
                <h1>注册账号</h1>
                <p>鲁岳企业服务·重点群体涉税申报项目资料处理综合智能平台</p>
            </div>

            {% if is_first %}
            <div class="auth-info">
                系统首次使用，您将注册为管理员账号。<br>
                注册成功后，可在系统中生成邀请码邀请其他用户。
            </div>
            {% else %}
            <div class="auth-info">
                本系统采用邀请制注册，请输入有效的邀请码。
            </div>
            {% endif %}

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register" class="auth-form">
                {% if not is_first %}
                <div class="form-group">
                    <label>邀请码</label>
                    <input type="text" name="invite_code" placeholder="请输入邀请码" required>
                </div>
                {% endif %}
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" name="username" placeholder="设置账号（3-20位字母/数字）" required pattern="[A-Za-z0-9_]{3,20}">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="设置密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" name="confirm_password" placeholder="请再次输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">注 册</button>
            </form>

            <div class="auth-footer">
                <a href="/login">已有账号？返回登录</a>
            </div>
        </div>
    </div>
</body>
</html>
